name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # The SQL tests run against a real Postgres, so CI provides one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Local, and ends in _test — the test harness refuses anything else.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mb_tasks_test
      # Not a real secret: nothing in CI signs a session anyone will use.
      AUTH_SECRET: ci-secret-not-used-outside-this-job
      APP_TIMEZONE: Asia/Manila

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # DATABASE_URL is only needed so drizzle.config.ts can be imported during
      # the build; nothing connects to it.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
